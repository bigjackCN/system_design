services:
  postgres:
    image: postgres:16
    container_name: ticketmaster-db
    environment:
      POSTGRES_DB: ticketmaster
      POSTGRES_USER: ticketmaster_user
      POSTGRES_PASSWORD: ticketmaster_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketmaster_user -d ticketmaster"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
