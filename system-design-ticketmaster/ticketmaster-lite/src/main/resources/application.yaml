spring:
  application:
    name: ticketmaster-lite

  datasource:
    url: jdbc:postgresql://localhost:5432/ticketmaster
    username: ticketmaster_user
    password: ticketmaster_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        show-sql: true

  server:
    port: 8080